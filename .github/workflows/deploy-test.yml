name: Deploy (Test)

on:
    push:
        branches:
            - test
        paths:
            - "frontend/**"
            - "quartz/**"
            - ".github/workflows/deploy-test.yml"
    workflow_dispatch:

# ─── Custom Domain Configuration ────────────────────────────────────────────
# To move the docs to a custom domain, update PAGES_DOMAIN and PAGES_BASE_PATH
# to match your production workflow settings.
# ────────────────────────────────────────────────────────────────────────────
env:
    PAGES_DOMAIN: "" 
    PAGES_BASE_PATH: "/mlviz"
    DOCS_SUBDIR: "docs-test"
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    REGION: ${{ secrets.GCP_REGION }}
    BUCKET_NAME: mlviz-test
    BACKEND_SERVICE_NAME: mlviz-backend-test

permissions:
    contents: read

jobs:
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        outputs:
            backend-url: ${{ steps.get-url.outputs.url }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for GCR
              run: gcloud auth configure-docker

            - name: Build and push Docker image
              working-directory: ./backend
              run: |
                  IMAGE_NAME="gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE_NAME }}"
                  docker build -t "${IMAGE_NAME}:${{ github.sha }}" -t "${IMAGE_NAME}:latest" .
                  docker push "${IMAGE_NAME}:${{ github.sha }}"
                  docker push "${IMAGE_NAME}:latest"

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
                    --image "gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}" \
                    --platform managed \
                    --region ${{ env.REGION }} \
                    --allow-unauthenticated \
                    --port 8080 \
                    --memory 512Mi \
                    --cpu 1 \
                    --min-instances 0 \
                    --max-instances 10 \
                    --set-env-vars "DEBUG=false,FRONTEND_URL=https://${{ env.BUCKET_NAME }}.storage.googleapis.com"

            - name: Get service URL
              id: get-url
              run: |
                  SERVICE_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
                    --platform managed \
                    --region ${{ env.REGION }} \
                    --format 'value(status.url)')
                  echo "url=${SERVICE_URL}" >> $GITHUB_OUTPUT
                  echo "✅ Backend deployed to: ${SERVICE_URL}"

            - name: Test deployment
              run: |
                  curl -f ${{ steps.get-url.outputs.url }}/health || exit 1
                  echo "✅ Health check passed"

    deploy-frontend:
        name: Deploy Frontend to GCS
        runs-on: ubuntu-latest
        if: github.repository == 'local-minima-lab/mlviz'
        needs: deploy-backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Build frontend with backend URL
              working-directory: ./frontend
              env:
                  VITE_FAVICON: /mlviz_orange.png
                  VITE_TITLE: mlviz (test)
                  VITE_CONFIG_FILE: test
                  VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.backend-url }}
              run: |
                  echo "Building with backend URL: $VITE_API_BASE_URL"
                  npm run build

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Create bucket if not exists
              run: |
                  if ! gsutil ls -b gs://${{ env.BUCKET_NAME }} > /dev/null 2>&1; then
                    gsutil mb -l ${{ env.REGION }} gs://${{ env.BUCKET_NAME }}
                    echo "✅ Bucket gs://${{ env.BUCKET_NAME }} created"
                  else
                    echo "✅ Bucket gs://${{ env.BUCKET_NAME }} already exists"
                  fi

            - name: Configure Static Website Hosting
              run: |
                  gsutil web set -m index.html -e index.html gs://${{ env.BUCKET_NAME }}
                  echo "✅ Web hosting configured (index/error: index.html)"

            - name: Upload files to GCS
              run: |
                  gsutil -m rsync -r -d frontend/dist gs://${{ env.BUCKET_NAME }}
                  echo "✅ Files uploaded to gs://${{ env.BUCKET_NAME }}"

            - name: Make objects public
              run: |
                  gsutil iam ch allUsers:objectViewer gs://${{ env.BUCKET_NAME }}
                  echo "✅ Bucket made public (objectViewer)"

            - name: Set cache control headers
              run: |
                  # Cache assets for 1 year
                  gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://${{ env.BUCKET_NAME }}/assets/**
                  # Don't cache index.html
                  gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" gs://${{ env.BUCKET_NAME }}/index.html
                  echo "✅ Cache headers set"

            - name: Deployment Summary
              run: |
                  echo "======================================"
                  echo "🚀 Test Frontend Deployed to GCS"
                  echo "======================================"
                  echo "Frontend URL: https://${{ env.BUCKET_NAME }}.storage.googleapis.com/index.html"
                  echo "Backend URL:  ${{ needs.deploy-backend.outputs.backend-url }}"
                  echo "======================================"

    build-docs:
        name: Build Docs Artifact
        runs-on: ubuntu-latest
        if: github.repository == 'local-minima-lab/mlviz'
        needs: deploy-frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Compute Quartz base URL
              id: paths
              run: |
                  if [ -n "${{ env.PAGES_DOMAIN }}" ]; then
                    QUARTZ_BASE_URL="${{ env.PAGES_DOMAIN }}/${{ env.DOCS_SUBDIR }}"
                    SITE_SUBDIR="${{ env.DOCS_SUBDIR }}"
                  else
                    REPO="${{ github.repository }}"
                    ORG="${REPO%%/*}"
                    BASE="${{ env.PAGES_BASE_PATH }}"
                    QUARTZ_BASE_URL="${ORG}.github.io${BASE}/${{ env.DOCS_SUBDIR }}"
                    SITE_SUBDIR="${BASE#/}/${{ env.DOCS_SUBDIR }}"
                  fi
                  echo "quartz_base_url=${QUARTZ_BASE_URL}" >> $GITHUB_OUTPUT
                  echo "site_subdir=${SITE_SUBDIR}" >> $GITHUB_OUTPUT

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: quartz/package-lock.json

            - name: Install Quartz dependencies
              working-directory: ./quartz
              run: npm ci

            - name: Build Quartz documentation
              working-directory: ./quartz
              env:
                  QUARTZ_BASE_URL: ${{ steps.paths.outputs.quartz_base_url }}
              run: |
                  echo "Building Quartz with base URL: $QUARTZ_BASE_URL"
                  npx quartz build

            - name: Assemble docs artifact
              run: |
                  SITE_SUBDIR="${{ steps.paths.outputs.site_subdir }}"
                  mkdir -p "_site/${SITE_SUBDIR}"
                  cp -r quartz/public/. "_site/${SITE_SUBDIR}/"
                  echo "Assembled docs structure:"
                  find _site -maxdepth 3 -type f | head -20

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy-docs:
        name: Deploy Docs to GitHub Pages
        runs-on: ubuntu-latest
        needs: build-docs
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Documentation Deployment Summary
              run: |
                  echo "======================================"
                  echo "📚 Test Documentation Deployed to GitHub Pages"
                  echo "======================================"
                  echo "Docs URL: ${{ steps.deployment.outputs.page_url }}"
                  echo "======================================"
