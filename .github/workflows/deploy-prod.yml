name: Deploy (Production)

on:
    push:
        branches:
            - main
        paths:
            - "frontend/**"
            - "quartz/**"
            - ".github/workflows/deploy-frontend-gcs-prod.yml"
    workflow_dispatch:

env:
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    REGION: ${{ secrets.GCP_REGION }}
    BUCKET_NAME: mlviz
    BACKEND_SERVICE_NAME: backend

jobs:
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        outputs:
            backend-url: ${{ steps.get-url.outputs.url }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for GCR
              run: gcloud auth configure-docker

            - name: Build and push Docker image
              working-directory: ./backend
              run: |
                  IMAGE_NAME="gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE_NAME }}"
                  docker build -t "${IMAGE_NAME}:${{ github.sha }}" -t "${IMAGE_NAME}:latest" .
                  docker push "${IMAGE_NAME}:${{ github.sha }}"
                  docker push "${IMAGE_NAME}:latest"

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
                    --image "gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}" \
                    --platform managed \
                    --region ${{ env.REGION }} \
                    --allow-unauthenticated \
                    --port 8080 \
                    --memory 512Mi \
                    --cpu 1 \
                    --min-instances 0 \
                    --max-instances 10 \
                    --set-env-vars "DEBUG=false,FRONTEND_URL=https://local-minima-lab.github.io/mlviz"

            - name: Get service URL
              id: get-url
              run: |
                  SERVICE_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} \
                    --platform managed \
                    --region ${{ env.REGION }} \
                    --format 'value(status.url)')
                  echo "url=${SERVICE_URL}" >> $GITHUB_OUTPUT
                  echo "✅ Backend deployed to: ${SERVICE_URL}"

            - name: Test deployment
              run: |
                  curl -f ${{ steps.get-url.outputs.url }}/health || exit 1
                  echo "✅ Health check passed"

    deploy-frontend:
        name: Deploy Frontend to GitHub Pages
        runs-on: ubuntu-latest
        if: github.repository == 'local-minima-lab/mlviz'
        needs: deploy-backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Build frontend with backend URL
              working-directory: ./frontend
              env:
                  VITE_FAVICON: /mlviz.png
                  VITE_TITLE: mlviz
                  VITE_CONFIG_FILE: config
                  VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.backend-url }}
              run: |
                  echo "Building with backend URL: $VITE_API_BASE_URL"
                  npm run build

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./frontend/dist
                  destination_dir: .
                  keep_files: true

            - name: Deployment Summary
              run: |
                  echo "======================================"
                  echo "🚀 Production Frontend Deployed to GitHub Pages"
                  echo "======================================"
                  echo "Frontend URL: https://local-minima-lab.github.io/mlviz"
                  echo "Backend URL:  ${{ needs.deploy-backend.outputs.backend-url }}"
                  echo "======================================"

    deploy-docs:
        name: Deploy Documentation
        runs-on: ubuntu-latest
        if: github.repository == 'local-minima-lab/mlviz'
        needs: deploy-frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: quartz/package-lock.json

            - name: Install Quartz dependencies
              working-directory: ./quartz
              run: npm ci

            - name: Build Quartz documentation
              working-directory: ./quartz
              env:
                  QUARTZ_BASE_URL: "local-minima-lab.github.io/mlviz/docs"
              run: |
                  echo "Building Quartz with base URL: $QUARTZ_BASE_URL"
                  npx quartz build

            - name: Deploy Docs to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./quartz/public
                  destination_dir: docs
                  keep_files: true

            - name: Documentation Deployment Summary
              run: |
                  echo "======================================"
                  echo "📚 Documentation Deployed"
                  echo "======================================"
                  echo "Docs URL: https://local-minima-lab.github.io/mlviz/docs/"
                  echo "======================================"

